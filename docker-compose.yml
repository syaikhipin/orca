services:
  orca:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The public origin of this instance (MCP clients display it).
      - SIGHTLINE_PUBLIC_URL=https://orca.arifin.uk
      # Demo caps, mirroring deploy/modal_app.py. 0 further down = off/no limit.
      - SIGHTLINE_PROPOSE_PER_HOUR=20
      - SIGHTLINE_PROPOSE_PER_DAY=300
      - SIGHTLINE_ESCALATE_PER_HOUR=3
      - SIGHTLINE_ESCALATE_PER_DAY=30
      - SIGHTLINE_WONDER_MAX_USD_DAY=25
      - SIGHTLINE_BUILT_VIEWS=0
      # Speech off: Opencode Go has no transcription endpoint (Meta-only
      # /asr/transcribe), so the mic is hidden and the voice routes refuse.
      - SIGHTLINE_VOICE=off
      - SIGHTLINE_BUILT_PER_HOUR=6
      - SIGHTLINE_BUILT_PER_DAY=60
      - SIGHTLINE_CHAT_PER_HOUR=40
      - SIGHTLINE_CHAT_PER_DAY=1500
      - SIGHTLINE_VOICE_PER_HOUR=60
      - SIGHTLINE_VOICE_PER_DAY=2000
      - SIGHTLINE_MAX_SCENES=8
      - SIGHTLINE_MAX_REPORTS=8
      - SIGHTLINE_UPLOAD_MAX_MB=150
      - SIGHTLINE_MODEL_UPLOAD_MAX_MB=150
      - SIGHTLINE_SCENE_BUDGET_MB=300
      - SIGHTLINE_MODEL_UPLOADS_PER_HOUR=10
      - SIGHTLINE_MODEL_UPLOADS_PER_DAY=200
      - SIGHTLINE_LINKS_PER_HOUR=10
      - SIGHTLINE_LINKS_PER_DAY=500
      - SIGHTLINE_AGENT_CALLS_PER_HOUR=600
      - SIGHTLINE_OPEN_WEIGHTS=1
      # Behind the Cloudflare tunnel + Coolify proxy, the visitor's address
      # arrives in X-Forwarded-For (Modal sets 0 because its edge differs).
      - SIGHTLINE_TRUST_FORWARDED=1
      # ALL AI features run on the owner's Opencode Go subscription.
      # META_API_KEY and TRIAGE_API_KEY (the same Opencode Go key) are set in
      # Coolify's environment, never in git.
      - META_API_BASE_URL=https://opencode.ai/zen/go/v1
      - META_MODEL=glm-5.3
      - META_ESCALATION_MODEL=glm-5.3
      # GLM on Go takes no reasoning_effort parameter; empty omits it.
      - META_REASONING_EFFORT=
      - META_ESCALATION_EFFORT=
      # Bulk triage/titles on the cheaper flash model, same endpoint + key.
      - TRIAGE_API_BASE_URL=https://opencode.ai/zen/go/v1
      - TRIAGE_MODEL=glm-5.3-flash
      - TRIAGE_REASONING_EFFORT=
    # No host port binding: GreenForge already owns host :8000 on campus-pc.
    # Coolify's proxy reaches this container on its internal port via labels.
    expose:
      - "8000"
